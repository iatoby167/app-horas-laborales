<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libreta de Horas · Hub financiero</title>
<meta name="description" content="Hub personal de ingresos, proyectos, Micro-SaaS, cobros y horas trabajadas.">
<meta name="theme-color" content="#E9EEEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1411" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hub ingresos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #e9eeea;
  --surface: #f6f8f5;
  --surface-2: #dde5e0;
  --surface-3: #eff3ef;
  --ink: #14201a;
  --muted: #506157;
  --line: #c4cfc8;
  --accent: #0f6b50;
  --accent-soft: #d7eee5;
  --on-accent: #fff;
  --holiday: #b4531a;
  --holiday-soft: #f3e0d2;
  --danger: #a62a2a;
  --focus: #0f6b50;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0e1411;
    --surface: #161f1a;
    --surface-2: #1e2923;
    --surface-3: #19241e;
    --ink: #e5eee8;
    --muted: #93a59a;
    --line: #2b3932;
    --accent: #3cc79a;
    --accent-soft: #173d2f;
    --on-accent: #05231a;
    --holiday: #f0a24e;
    --holiday-soft: #35240f;
    --danger: #ff8f85;
    --focus: #3cc79a;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.45 var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button, select { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }

.app-shell {
  width: min(100%, 88rem);
  margin: 0 auto;
  padding: max(18px, env(safe-area-inset-top, 0px)) clamp(16px, 3vw, 40px) calc(48px + env(safe-area-inset-bottom, 0px));
}
.app-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 0 18px;
}
.brand-block { min-width: 0; }
.brand { display: block; font: 700 12px var(--font-display); letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
.brand-subtitle { display: block; margin-top: 2px; font-size: 13px; color: var(--muted); }
.top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
.top-actions .btn { white-space: nowrap; }
.status { font: 400 12px var(--font-data); color: var(--muted); white-space: nowrap; }
.status[data-state="error"] { color: var(--danger); }
.status[data-state="saved"] { color: var(--accent); }

.controlbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 12px;
  align-items: center;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  position: sticky;
  top: max(8px, env(safe-area-inset-top, 0px));
  z-index: 5;
  box-shadow: 0 8px 24px rgb(0 0 0 / .06);
  backdrop-filter: blur(16px);
}
.main-nav { display: flex; gap: 3px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.main-nav::-webkit-scrollbar { display: none; }
.main-nav button, .filter-control button, .mode-tabs button {
  min-height: 38px;
  padding: 0 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-weight: 650;
  white-space: nowrap;
}
.main-nav button[aria-current="page"], .filter-control button[aria-pressed="true"], .mode-tabs button[aria-pressed="true"] {
  background: var(--surface-2);
  color: var(--ink);
}
.period-control { display: flex; align-items: center; gap: 4px; }
.period-control .icon-button { width: 38px; height: 38px; }
.today-button { min-height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 700; }
.period-name { min-width: 136px; text-align: center; font: 700 14px var(--font-display); }
.month-picker { position: relative; width: 28px; height: 38px; overflow: hidden; border-radius: 9px; background: var(--surface-2); }
.month-picker::after { content: '⌄'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
.month-picker input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.filter-control { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 12px; background: var(--surface-2); }
.filter-control button { min-height: 32px; padding-inline: 9px; font-size: 12px; }
.filter-control button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

.btn, .icon-button {
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  font-weight: 650;
  padding: 0 15px;
}
.btn:hover, .icon-button:hover, .text-button:hover { filter: brightness(.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 36px; padding-inline: 12px; font-size: 13px; }
.icon-button { padding: 0; display: grid; place-items: center; font-size: 20px; }
.text-button { border: 0; background: transparent; color: var(--accent); padding: 6px; font-weight: 700; }
.mini-link { font-size: 13px; font-weight: 700; text-decoration: none; }

#view { padding-top: clamp(22px, 3vw, 38px); }
.dashboard-hero, .page-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 26px;
}
.dashboard-hero { min-height: 122px; }
.eyebrow, .section-kicker { color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
.dashboard-hero h1, .page-heading h1 { max-width: 760px; margin-top: 5px; font-size: clamp(28px, 4vw, 46px); line-height: 1.02; letter-spacing: -.035em; }
.lede { max-width: 660px; margin-top: 10px; color: var(--muted); font-size: 16px; }
.hero-action { flex: none; }

.kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi-card, .collection-card, .tracker-widget, .income-card, .calendar-panel, .payment-panel, .settings-card {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 18px;
}
.kpi-card { min-height: 146px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; }
.kpi-card span { color: var(--muted); font-size: 13px; font-weight: 650; }
.kpi-card strong { font: 700 clamp(23px, 2.6vw, 34px)/1 var(--font-display); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.kpi-card small { color: var(--muted); font-size: 12px; }
.kpi-card.accent { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.kpi-card.accent span, .kpi-card.accent small { color: color-mix(in srgb, var(--on-accent) 74%, transparent); }
.kpi-card.total { background: var(--surface-2); }

.dashboard-split { display: grid; grid-template-columns: minmax(260px, .9fr) minmax(360px, 1.1fr); gap: 14px; margin-top: 14px; }
.collection-card, .tracker-widget { padding: 20px; }
.collection-amounts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
.collection-amounts span, .tracker-numbers span { display: block; color: var(--muted); font-size: 12px; }
.collection-amounts strong { display: block; margin-top: 3px; font: 650 21px var(--font-data); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.collection-bar { height: 10px; margin-top: 18px; overflow: hidden; border-radius: 999px; background: var(--surface-2); }
.collection-bar span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .25s ease; }
.collection-card p { margin-top: 9px; color: var(--muted); font-size: 13px; }
.tracker-title-row, .card-heading, .card-topline, .card-footer, .calendar-toolbar, .section-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.tracker-title-row h3 { font-size: 21px; }
.tracker-title-row p { margin-top: 2px; color: var(--muted); font-size: 13px; }
.tracker-numbers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
.tracker-numbers b { display: block; margin-top: 3px; font: 500 17px var(--font-data); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.tracker-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 20px; color: var(--muted); font-size: 13px; }

.module-section { margin-top: 34px; }
.module-section.two-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.section-header { align-items: center; margin-bottom: 12px; }
.section-header h2 { margin-top: 2px; font-size: 23px; letter-spacing: -.02em; }
.card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.catalog-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.stack-list { display: flex; flex-direction: column; gap: 10px; }
.income-card { padding: 16px; min-width: 0; }
.income-card.compact { padding: 14px; }
.card-topline { min-height: 25px; }
.badge-group { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
.type-badge, .badge { display: inline-flex; align-items: center; width: max-content; max-width: 100%; min-height: 23px; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); font-size: 10px; font-weight: 750; letter-spacing: .03em; white-space: nowrap; }
.type-badge { color: var(--muted); background: var(--surface-3); }
.type-badge.saas { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.type-badge.project { color: var(--holiday); border-color: color-mix(in srgb, var(--holiday) 50%, var(--line)); }
.badge.payment.paid { color: var(--accent); border-color: var(--accent); }
.badge.payment.partial { color: var(--holiday); border-color: var(--holiday); }
.badge.payment.pending { color: var(--muted); }
.badge.project.active { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.badge.project.development { color: var(--holiday); border-color: color-mix(in srgb, var(--holiday) 55%, var(--line)); }
.badge.project.paused { color: var(--muted); }
.badge.project.delivered { color: var(--ink); }
.card-heading { margin-top: 12px; }
.card-heading h3 { font-size: 19px; line-height: 1.1; overflow-wrap: anywhere; }
.card-heading p { margin-top: 5px; color: var(--muted); font: 12px var(--font-data); }
.card-amount { flex: none; font: 500 18px/1.15 var(--font-data); letter-spacing: -.05em; font-variant-numeric: tabular-nums; text-align: right; }
.card-amount.positive { color: var(--accent); }
.card-amount.muted { color: var(--muted); }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; min-height: 20px; margin-top: 14px; color: var(--muted); font-size: 12px; }
.meta-item { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.note-preview { flex: 1 1 100%; }
.card-footer { align-items: center; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.card-actions { display: flex; align-items: center; gap: 4px; }

.empty-state { grid-column: 1 / -1; min-height: 184px; padding: 24px; border: 1px dashed var(--line); border-radius: 16px; background: var(--surface); background: color-mix(in srgb, var(--surface) 66%, transparent); display: grid; place-items: center; text-align: center; }
.empty-state .empty-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 500 24px var(--font-data); }
.empty-state h3 { margin-top: 8px; font-size: 17px; }
.empty-state p { max-width: 340px; margin: 5px 0 14px; color: var(--muted); font-size: 13px; }

.hours-summary-layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(270px, .85fr); gap: 14px; }
.tracker-widget.large { min-height: 242px; display: flex; flex-direction: column; justify-content: center; }
.tracker-widget.large .tracker-numbers { margin-top: 25px; }
.payment-panel, .settings-card { padding: 20px; }
.payment-panel h2, .settings-card h2 { margin: 3px 0 16px; font-size: 22px; }
.payment-panel label, .dialog-grid label, .settings-card label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 650; }
.payment-panel label + label { margin-top: 12px; }
.payment-panel select, .payment-panel input, .dialog-grid input, .dialog-grid select, .dialog-grid textarea, .settings-card input {
  width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); color: var(--ink);
}
.payment-panel .note { margin: 13px 0; color: var(--muted); font-size: 13px; }
.calendar-panel { margin-top: 14px; padding: 20px; }
.calendar-toolbar { align-items: center; }
.calendar-toolbar h2 { margin-top: 2px; font-size: 23px; }
.rate-field { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 650; }
.rate-field input { width: 120px; min-height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--bg); color: var(--ink); font: 500 16px var(--font-data); }
.mode-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin-top: 20px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.mode-tabs button { min-height: 42px; }
.mode-tabs button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .13); }
.hint { margin: 10px 0 16px; color: var(--muted); font-size: 13px; }
.weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.weekdays { margin-bottom: 6px; }
.weekdays span { text-align: center; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
.day { position: relative; min-width: 0; aspect-ratio: 1 / 1.05; min-height: 50px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); text-align: left; display: flex; flex-direction: column; justify-content: space-between; font-weight: 700; }
.day small { min-height: 10px; font: 500 10px var(--font-data); letter-spacing: -.04em; white-space: nowrap; }
.day.weekend { background: var(--surface-2); }
.day.holiday { background: var(--holiday-soft); border-color: var(--holiday); }
.day.holiday::after { content: ''; position: absolute; top: 0; right: 0; width: 13px; height: 13px; background: var(--holiday); clip-path: polygon(0 0,100% 0,100% 100%); }
.day.worked { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.day.worked.holiday { background: var(--holiday); border-color: var(--holiday); color: #2b1703; }
.day.today { box-shadow: inset 0 0 0 2px var(--ink); }
.day.blank { visibility: hidden; pointer-events: none; }
.calendar-total { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; padding: 12px 0 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.calendar-total strong { color: var(--ink); font: 500 19px var(--font-data); letter-spacing: -.05em; }

.settings-layout { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.default-hours-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.default-hours-grid label { align-items: center; }
.default-hours-grid label span { text-transform: uppercase; font-size: 10px; }
.default-hours-grid input { min-width: 0; text-align: center; padding-inline: 2px; font: 500 15px var(--font-data); }
.wide-label { margin-top: 15px; }
.settings-card .note { margin-top: 14px; color: var(--muted); font-size: 13px; }
.button-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

dialog { width: min(calc(100% - 24px), 680px); max-height: min(92vh, 760px); padding: 0; border: 1px solid var(--line); border-radius: 20px; color: var(--ink); background: var(--surface); box-shadow: 0 24px 80px rgb(0 0 0 / .35); }
dialog::backdrop { background: rgb(0 0 0 / .48); backdrop-filter: blur(3px); }
.dialog-content { padding: clamp(18px, 4vw, 28px); overflow: auto; max-height: min(92vh, 760px); }
.dialog-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.dialog-header h2 { margin-top: 3px; font-size: 27px; }
.dialog-close { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font-size: 22px; }
.dialog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
.dialog-grid .full { grid-column: 1 / -1; }
.dialog-grid .field-wrap { min-width: 0; }
.dialog-grid textarea { min-height: 92px; resize: vertical; }
.dialog-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 22px; }
.dialog-actions .spacer { flex: 1; }
.form-error { margin-top: 12px; color: var(--danger); font-size: 13px; }
.import-dialog { width: min(calc(100% - 24px), 520px); }
.import-dialog p { margin: 12px 0 18px; color: var(--muted); }
.checkbox-line { display: flex; align-items: center; min-height: 42px; gap: 8px; color: var(--ink); font-weight: 500; }
.checkbox-line input { width: 20px; min-height: 20px; accent-color: var(--accent); }

@media (max-width: 1080px) {
  .controlbar { grid-template-columns: 1fr auto; }
  .filter-control { grid-column: 1 / -1; width: max-content; }
  .kpi-grid, .catalog-grid, .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .settings-layout { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 760px) {
  .app-shell { padding-inline: 14px; }
  .app-topbar { align-items: flex-start; }
  .top-actions { flex-direction: column-reverse; align-items: flex-end; gap: 6px; }
  .controlbar { display: flex; flex-wrap: wrap; gap: 8px; }
  .main-nav { order: 1; flex: 1 1 100%; }
  .period-control { order: 2; }
  .filter-control { order: 3; margin-left: auto; }
  .dashboard-hero, .page-heading { align-items: flex-start; flex-direction: column; gap: 14px; }
  .dashboard-hero h1, .page-heading h1 { font-size: clamp(28px, 9vw, 40px); }
  .hero-action { width: 100%; }
  .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi-card { min-height: 128px; }
  .dashboard-split, .hours-summary-layout, .module-section.two-columns { grid-template-columns: 1fr; }
  .module-section.two-columns { gap: 26px; }
  .tracker-widget.large { min-height: 0; }
  .settings-layout { grid-template-columns: 1fr; }
}

@media (max-width: 480px) {
  .app-shell { padding-inline: 12px; }
  .brand-subtitle { display: none; }
  .status { max-width: 135px; overflow: hidden; text-overflow: ellipsis; }
  .top-actions .btn { padding-inline: 12px; }
  .period-name { min-width: 118px; font-size: 13px; }
  .filter-control { width: 100%; justify-content: space-between; }
  .filter-control button { flex: 1; }
  .kpi-grid, .catalog-grid, .card-grid { grid-template-columns: 1fr; }
  .kpi-card { min-height: 112px; }
  .kpi-card strong { font-size: 29px; }
  .collection-card, .tracker-widget, .calendar-panel, .payment-panel, .settings-card { padding: 16px; border-radius: 16px; }
  .tracker-numbers { gap: 8px; }
  .tracker-numbers b { font-size: 15px; }
  .calendar-toolbar { align-items: flex-start; flex-direction: column; }
  .rate-field { width: 100%; justify-content: space-between; }
  .rate-field input { width: 142px; }
  .day { min-height: 42px; padding: 4px; border-radius: 8px; font-size: 13px; }
  .day small { font-size: 9px; }
  .weekdays, .calendar-grid { gap: 4px; }
  .calendar-total { align-items: flex-start; flex-direction: column; }
  .dialog-grid { grid-template-columns: 1fr; }
  .dialog-grid .full { grid-column: auto; }
  .dialog-actions .spacer { display: none; }
  .dialog-actions .btn { flex: 1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
}
</style>
</head>
<body>
  <div class="app-shell">
    <header class="app-topbar">
      <div class="brand-block">
        <span class="brand">Libreta de horas</span>
        <span class="brand-subtitle">Hub central de ingresos</span>
      </div>
      <div class="top-actions">
        <span class="status" id="status" role="status" data-state="idle">Se guarda en este dispositivo</span>
        <button id="addSource" class="btn primary" type="button">+ Nueva fuente</button>
      </div>
    </header>

    <section class="controlbar" aria-label="Navegación y período">
      <nav class="main-nav" id="mainNav" aria-label="Navegación principal">
        <button type="button" data-route="hub" aria-current="page">Hub</button>
        <button type="button" data-route="saas" aria-current="false">Micro-SaaS</button>
        <button type="button" data-route="projects" aria-current="false">Desarrollos</button>
        <button type="button" data-route="hours" aria-current="false">Tracker de horas</button>
        <button type="button" data-route="settings" aria-current="false">Ajustes</button>
      </nav>
      <div class="period-control" aria-label="Período">
        <button id="prevPeriod" class="icon-button" type="button" aria-label="Mes anterior">‹</button>
        <span id="periodLabel" class="period-name"></span>
        <label class="month-picker" aria-label="Elegir mes"><input id="periodInput" type="month"></label>
        <button id="todayPeriod" class="today-button" type="button">Hoy</button>
        <button id="nextPeriod" class="icon-button" type="button" aria-label="Mes siguiente">›</button>
      </div>
      <div id="filterControl" class="filter-control" role="group" aria-label="Filtrar cobros">
        <button type="button" data-filter="all" aria-pressed="true">Todo</button>
        <button type="button" data-filter="pending" aria-pressed="false">Pendientes</button>
        <button type="button" data-filter="paid" aria-pressed="false">Cobrados</button>
      </div>
    </section>

    <main id="view"></main>
  </div>

  <dialog id="sourceDialog" aria-labelledby="sourceDialogTitle">
    <div class="dialog-content">
      <div class="dialog-header">
        <div><p class="eyebrow">Fuente de ingreso</p><h2 id="sourceDialogTitle">Nueva fuente</h2></div>
        <button id="closeSource" class="dialog-close" type="button" aria-label="Cerrar">×</button>
      </div>
      <form id="sourceForm" novalidate>
        <input type="hidden" name="id">
        <div class="dialog-grid">
          <label class="full">Nombre de la app, proyecto o cliente
            <input name="name" maxlength="120" autocomplete="off" required placeholder="Ej. Mantenimiento Tienda Norte">
          </label>
          <label>Tipo de ingreso
            <select name="type">
              <option value="saas">Micro-SaaS / Suscripción</option>
              <option value="project">Desarrollo puntual (pago único)</option>
              <option value="hours">Servicio por horas / Freelance</option>
              <option value="fixed">Ingreso fijo / Extra</option>
            </select>
          </label>
          <label id="sourceAmountWrap"><span id="sourceAmountLabel">Monto</span>
            <input name="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
          </label>
          <label id="sourceCycleWrap">Ciclo de cobro
            <select name="billingCycle">
              <option value="monthly">Mensual</option>
              <option value="weekly">Semanal</option>
              <option value="quarterly">Trimestral</option>
              <option value="annual">Anual</option>
              <option value="once">Única vez</option>
            </select>
          </label>
          <label id="sourceClientsWrap">Suscriptores / clientes
            <input name="clients" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
          </label>
          <label id="sourceHoursWrap">Horas estimadas del período
            <input name="estimatedHours" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
          </label>
          <label>Estado del proyecto
            <select name="projectStatus">
              <option value="development">En desarrollo</option>
              <option value="active">Activo</option>
              <option value="paused">Pausado</option>
              <option value="delivered">Entregado</option>
            </select>
          </label>
          <label>Estado de pago en este período
            <select name="paymentStatus">
              <option value="pending">Pendiente</option>
              <option value="partial">Cobrado parcial</option>
              <option value="paid">Cobrado total</option>
            </select>
          </label>
          <label>Monto ya cobrado
            <input name="paidAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
          </label>
          <label><span id="sourceDateLabel">Fecha estimada de cobro</span>
            <input name="expectedDate" type="date">
          </label>
          <label class="full">Enlace del proyecto (opcional)
            <input name="url" type="url" inputmode="url" autocomplete="url" placeholder="https://...">
          </label>
          <label class="full">Notas adicionales
            <textarea name="notes" maxlength="1500" placeholder="Alcance, próximo paso, detalle de cobro…"></textarea>
          </label>
        </div>
        <p id="sourceError" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button id="deleteSource" class="btn danger" type="button" hidden>Eliminar</button>
          <span class="spacer"></span>
          <button class="btn" type="button" id="cancelSource">Cancelar</button>
          <button class="btn primary" type="submit">Guardar fuente</button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="hourDialog" aria-labelledby="hourDialogTitle">
    <div class="dialog-content">
      <div class="dialog-header">
        <div><p class="eyebrow">Registro diario</p><h2 id="hourDialogTitle">Editar horas</h2></div>
        <button id="closeHour" class="dialog-close" type="button" aria-label="Cerrar">×</button>
      </div>
      <form id="hourForm" novalidate>
        <input id="hourDate" type="hidden">
        <div class="dialog-grid">
          <label>Horas trabajadas
            <input id="hourInput" type="text" inputmode="decimal" autocomplete="off" placeholder="Ej. 6,5">
          </label>
          <label>Feriado
            <span class="checkbox-line"><input id="hourHoliday" type="checkbox"> Cuenta con multiplicador</span>
          </label>
        </div>
        <p id="hourError" class="form-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button id="removeHour" class="btn danger" type="button" hidden>Quitar día</button>
          <span class="spacer"></span>
          <button class="btn primary" type="submit">Guardar horas</button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="importDialog" class="import-dialog" aria-labelledby="importTitle">
    <div class="dialog-content">
      <div class="dialog-header"><div><p class="eyebrow">Copia de seguridad</p><h2 id="importTitle">Importar datos</h2></div></div>
      <p id="importSummary"></p>
      <div class="dialog-actions"><button id="cancelImport" class="btn" type="button">Cancelar</button><button id="applyImport" class="btn primary" type="button">Importar y reemplazar</button></div>
    </div>
  </dialog>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
  <noscript>Esta app necesita JavaScript para funcionar.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
